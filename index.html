<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p diddy</title>
    <style>
        body {
            background-color: rgb(112, 55, 66);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: arial, sans-serif;
            margin: 0;
        }

        .card {
            background-color: black;
            width: 300px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100px;
            border-radius: 50%;
        }

        .card h2 {
            color: white;
        }

        .card p {
            color: white;
        }

        button {
            background-color: rgb(13, 201, 201);
            color: rgb(8, 2, 2);
            border: none;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(16, 185, 228);
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://p2.trrsf.com/image/fget/cf/1200/1200/middle/images.terra.com/2012/10/23/neymar1.jpg" alt="foto de perfil">
        <h2>Neymar de cueca</h2>
        <p>CUIDADO!!!!
        </p>
        <button>Entrar em contato</button>
    </div>
</body>
</html>
